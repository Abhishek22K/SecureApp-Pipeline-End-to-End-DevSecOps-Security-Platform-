{% extends "base.html" %}
{% block content %}
    <h1>Admin Panel</h1>
    <h2>Manage Users</h2>
    <form method="GET" action="{{ url_for('admin_panel') }}">
        <label for="search">Search User:</label>
        <input type="text" id="search" name="search" value="{{ request.args.get('search', '') }}">
        <button type="submit">Search</button>
    </form>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Is Admin</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.username }}</td>
                    <td>{{ 'Yes' if user.is_admin else 'No' }}</td>
                    <td>
                        <a href="{{ url_for('delete_user', user_id=user.id) }}">Delete</a> {# Vulnerability: CSRF #}
                    </td>
                </tr>
            {% else %}
                <tr>
                    <td colspan="4">No users found.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
